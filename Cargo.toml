[package]
name = "kakera"
version = "0.1.4"
authors = ["enotan <uminekolover99@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.9", features = ["router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
chrono = { version = "0.4.41", features = ["serde"] }
rfd = "0.17.2"
discord-rich-presence = "1.1.0"
base64 = "0.22.1"
blake3 = "1"
tempfile = "3"
iroh = { version = "1.0", default-features = false, features = ["tls-aws-lc-rs"] }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[package.metadata.packager]
product-name = "Kakera"
identifier = "com.enotan.kakera"
icons = ["assets/favicon.png", "assets/favicon.ico"]
before-packaging-command = "dx build --release"
binaries-dir = "target/dx/kakera/release/linux/app"

resources = [
    { src = "target/dx/kakera/release/linux/app/assets", target = "assets" },
]

[package.metadata.packager.appimage]
libs = [
    "WebKitNetworkProcess",
    "WebKitWebProcess",
    "libwebkit2gtkinjectedbundle.so",
]

excluded-libraries = [
    "libwayland-*.so*",
    "libxkbcommon.so*",
]

files = {
    "target/dx/kakera/release/linux/app/assets" = "usr/lib/kakera/assets"
}

[package.metadata.packager.appimage.linuxdeploy-plugins]
gtk = "https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh"
